[package]
name = "atlas-fat-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
atlas-fat = { path = ".." }
atlas-fs-core = { version = "26.0.1-a", path = "../../atlas-fs-core" }

# Keeps the fuzz crate out of the library's own build.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fat_mount"
path = "fuzz_targets/fat_mount.rs"
test = false
doc = false
bench = false
