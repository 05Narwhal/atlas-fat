[package]
name = "atlas-fat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read FAT12, FAT16 and FAT32 volumes: boot sector, cluster chains, 8.3 and long names."
repository = "https://github.com/05Narwhal/atlas-fat"
homepage = "https://julianloy.com"
readme = "README.md"
keywords = ["fat", "fat32", "filesystem", "parser", "dos"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[features]
# Test volume builders and seed inputs, for crates that test against this one.
test-util = []

[dependencies]
atlas-fs-core = { version = "0.1", path = "../atlas-fs-core" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
